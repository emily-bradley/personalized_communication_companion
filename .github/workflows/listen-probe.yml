name: Listen probe

# Which iOS Simulator runtimes can run Listen fully on device, with Xcode 26 and Xcode 27.
# Runs when the probe changes, or by hand. It reports; it does not gate anything.
on:
  push:
    branches: [main]
    paths:
      - scripts/ci_listen_runtimes.sh
      - .github/workflows/listen-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Listen on each iOS Simulator (Xcode ${{ matrix.xcode }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "27"
            runner: xcode-27
            folder: listen-xcode27
          - xcode: "26"
            runner: macos-15
            folder: listen-xcode26
          # Xcode 27 needs macOS Tahoe 26.6, so Emily's Mac may run macOS 26 rather than the
          # macOS 27 of the xcode-27 runner. These two tell whether the host macOS matters.
          - xcode: "27"
            runner: macos-26
            folder: listen-macos26-xcode27
          - xcode: "26"
            runner: macos-26
            folder: listen-macos26-xcode26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: scripts/ci_select_xcode.sh ${{ matrix.xcode }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run the Listen test on every installed iOS runtime
        run: scripts/ci_listen_runtimes.sh "$RUNNER_TEMP/listen/listen-runtimes.txt"
      - name: Publish the report to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: scripts/ci_publish_images.sh "$RUNNER_TEMP/listen" ${{ matrix.folder }}
