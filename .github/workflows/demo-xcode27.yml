name: Xcode 27 demo and tests

# The Mac App Store offers Xcode 27 now, so scripts/demo.sh and every test (unit, UI, the
# demo walk and the accessibility audits) are proven on it and the iOS 27 Simulator too. It is
# its own workflow because Xcode 27 runs on the xcode-27 runner image, not macos-15.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    name: scripts/demo.sh (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: scripts/ci_select_xcode.sh 27
      - name: Remove any preinstalled iPhone 16, as on a Mac with a fresh Xcode 27
        run: scripts/ci_remove_iphone16.sh
      - name: Run the demo script
        run: /bin/bash scripts/demo.sh
      - name: Run it again with --welcome, then --fresh (the reset paths in DEMO.md)
        run: |
          /bin/bash scripts/demo.sh --welcome
          /bin/bash scripts/demo.sh --fresh
      - name: Publish demo screenshot to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cp build/demo-launch*.png "$RUNNER_TEMP/demo/" 2>/dev/null || true
          scripts/ci_publish_images.sh "$RUNNER_TEMP/demo" demo-xcode27
      - name: Upload demo screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-xcode27-launch
          path: build/demo-launch*.png
          if-no-files-found: warn

  demo-ios18:
    # Listen cannot hear in the iOS 27 Simulator, so DEMO.md tells Emily to add the iOS 18
    # Simulator to Xcode 27, and demo.sh then picks it by itself. This proves that path.
    name: scripts/demo.sh and Listen (Xcode 27, iOS 18 Simulator added)
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: scripts/ci_select_xcode.sh 27
      - name: Add the iOS 18 Simulator, as in Xcode Settings, Components
        run: |
          for v in 18.6 18.5 18.4 18.3.1 18.2 18.1 18.0; do
            echo "Trying iOS $v"
            if xcodebuild -downloadPlatform iOS -buildVersion "$v"; then break; fi
          done
          xcrun simctl list runtimes
      - name: Run the demo script (it should pick iOS 18 by itself)
        run: |
          mkdir -p build
          /bin/bash scripts/demo.sh | tee build/demo-ios18.txt
          grep -q "Using the iOS 18 Simulator" build/demo-ios18.txt
      - name: Listen on the iOS 18 Simulator (Selvo's own log lines, never what was heard)
        if: always()
        run: |
          OUT="$RUNNER_TEMP/ios18"
          mkdir -p "$OUT"
          cp build/demo-launch*.png "$OUT/" 2>/dev/null || true
          UDID=$(python3 scripts/find_simulator.py 'iPhone 16' 18)
          xcrun simctl list devices | grep "$UDID" > "$OUT/listen-ios18.txt" || true
          set +e
          xcodebuild test -project Selvo.xcodeproj -scheme Selvo -destination "id=$UDID" \
            -derivedDataPath build/DerivedData-ios18 CODE_SIGNING_ALLOWED=NO \
            -only-testing:SelvoUITests/DemoWalkUITests/testListenShowsListeningAndStops \
            > build/listen-ios18.log 2>&1
          echo "test exit $?" >> "$OUT/listen-ios18.txt"
          grep -E "error|failed|Executed|\*\* " build/listen-ios18.log | tail -40 >> "$OUT/listen-ios18.txt"
          xcrun simctl boot "$UDID" 2>/dev/null
          xcrun simctl bootstatus "$UDID" >/dev/null 2>&1
          xcrun simctl spawn "$UDID" log show --last 2h --style compact \
            --predicate 'subsystem == "com.emilykenney.selvo"' 2>&1 | grep "listen" >> "$OUT/listen-ios18.txt"
          cat "$OUT/listen-ios18.txt"
          grep -q "Starting recognition" "$OUT/listen-ios18.txt" && ! grep -q "Listening is not available" "$OUT/listen-ios18.txt"
      - name: Publish to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: scripts/ci_publish_images.sh "$RUNNER_TEMP/ios18" demo-xcode27-ios18

  tests:
    name: Build and test (Xcode 27, iOS 27 Simulator)
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: scripts/ci_select_xcode.sh 27
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Find simulator
        run: echo "UDID=$(python3 scripts/find_simulator.py 'iPhone 16')" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$TEST_RUNNER_SCREENSHOT_DIR" build
          set +e
          xcodebuild test \
            -project Selvo.xcodeproj \
            -scheme Selvo \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1
          status=$?
          grep -E "error|failed|Test Suite|Executed|AUDIT|\*\* " build/xcodebuild.log | tail -200
          grep -E "SPEECHPROBE|error|failed|Test Suite|Executed|XCTAssert|\*\* " build/xcodebuild.log | tail -300 > "$TEST_RUNNER_SCREENSHOT_DIR/build-summary.txt" || true
          if [ "$status" -ne 0 ]; then echo "---- last 120 lines ----"; tail -120 build/xcodebuild.log; fi
          exit $status
      - name: Save why Listen could or could not run (Selvo's own log lines, never what was heard)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" >/dev/null 2>&1 || true
          xcrun simctl spawn "$UDID" log show --last 2h --style compact \
            --predicate 'subsystem == "com.emilykenney.selvo"' > "$RUNNER_TEMP/screenshots/selvo-log.txt" 2>&1 || true
          tail -40 "$RUNNER_TEMP/screenshots/selvo-log.txt"
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: scripts/ci_publish_images.sh "$RUNNER_TEMP/screenshots" screenshots-xcode27
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-xcode27
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

