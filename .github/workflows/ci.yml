name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  core:
    name: SelvoCore tests and token check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: scripts/ci_select_xcode.sh
      - name: Generated tokens are up to date
        run: python3 scripts/gen_tokens.py --check
      - name: swift test
        run: swift test --package-path SelvoCore

  app:
    name: Build, test, screenshots
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: scripts/ci_select_xcode.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Find simulator
        run: echo "UDID=$(python3 scripts/find_simulator.py 'iPhone 16')" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$TEST_RUNNER_SCREENSHOT_DIR" build
          set +e
          xcodebuild test \
            -project Selvo.xcodeproj \
            -scheme Selvo \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Selvo.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1
          status=$?
          grep -E "error|failed|Test Suite|Executed|AUDIT|\*\* " build/xcodebuild.log | tail -200
          # Agents cannot download logs, so the summary travels with the screenshots.
          mkdir -p "$RUNNER_TEMP/screenshots"
          grep -E "error|failed|Test Suite|Executed|XCTAssert|\*\* " build/xcodebuild.log | tail -300 > "$RUNNER_TEMP/screenshots/build-summary.txt" || true
          if [ "$status" -ne 0 ]; then echo "---- last 120 lines ----"; tail -120 build/xcodebuild.log; fi
          exit $status
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: scripts/ci_publish_images.sh "$RUNNER_TEMP/screenshots" screenshots
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log

  # The Mac App Store now offers Xcode 26, so the demo script is proven with both 16 and 26.
  demo:
    name: scripts/demo.sh (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16"
            folder: demo
          - xcode: "26"
            folder: demo-xcode26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: scripts/ci_select_xcode.sh ${{ matrix.xcode }}
      - name: Run the demo script
        run: scripts/demo.sh
      - name: Run it again with --welcome, then --fresh (the reset paths in DEMO.md)
        run: |
          scripts/demo.sh --welcome
          scripts/demo.sh --fresh
      - name: Publish demo screenshot to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cp build/demo-launch*.png "$RUNNER_TEMP/demo/" 2>/dev/null || true
          scripts/ci_publish_images.sh "$RUNNER_TEMP/demo" ${{ matrix.folder }}
      - name: Upload demo screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.folder }}-launch
          path: build/demo-launch*.png
          if-no-files-found: warn

  xcode26:
    name: Build with Xcode 26 (TestFlight SDK)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: scripts/ci_select_xcode.sh 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for the Simulator
        run: |
          mkdir -p build
          set +e
          xcodebuild build \
            -project Selvo.xcodeproj \
            -scheme Selvo \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1
          status=$?
          grep -E "error|\*\* " build/xcodebuild.log | tail -80
          exit $status
