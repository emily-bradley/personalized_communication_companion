name: Website CI

on:
  push:
    branches: [website-staging]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Screenshots, axe, and page checks
        run: pnpm e2e
        env:
          CI: "true"
      - name: Lighthouse (accessibility 100, performance 90 or better)
        run: pnpm exec lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: website/lighthouse
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: website/screenshots/*.png
          if-no-files-found: warn
