<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const picked = st.picked ?? 0;
    const opts = ["Can we get coffee before work?", "Coffee first. Then I'll be nice.", "Is there time for coffee?"];
    const alt = ["Coffee. Now. Please.", "Do we have time to stop for coffee?", "I could use a coffee before we go."];
    const list = st.alt ? alt : opts;
    const v = { message: list[picked], spoken: !!st.spoken, notSpoken: !st.spoken,
      another: () => this.setState({ alt: !st.alt, picked: 0, spoken: false }),
      incorrect: () => this.setState({ picked: (picked + 1) % 3, spoken: false }),
      speakNow: () => { this.setState({ spoken: true }); setTimeout(() => this.setState({ spoken: false }), 1200); } };
    for (let i = 0; i < 3; i++) { v["s" + i] = picked === i; v["n" + i] = picked !== i; v["pick" + i] = () => this.setState({ picked: i, spoken: false }); }
    return v;
  }
}
</script>
