name: Xcode 27 demo and tests

# The Mac App Store offers Xcode 27 now, so scripts/demo.sh and every test (unit, UI, the
# demo walk and the accessibility audits) are proven on it and the iOS 27 Simulator too. It is
# its own workflow because Xcode 27 runs on the xcode-27 runner image, not macos-15.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Same as CI: a run already going finishes; a newer push replaces one still waiting.
concurrency:
  group: xcode27-${{ github.ref }}
  cancel-in-progress: false

jobs:
  demo:
    name: scripts/demo.sh (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: scripts/ci_select_xcode.sh 27
      - name: Remove any preinstalled iPhone 16, as on a Mac with a fresh Xcode 27
        run: scripts/ci_remove_iphone16.sh
      - name: Run the demo script
        run: /bin/bash scripts/demo.sh
      - name: Run it again with --welcome, then --fresh (the reset paths in DEMO.md)
        run: |
          /bin/bash scripts/demo.sh --welcome
          /bin/bash scripts/demo.sh --fresh
      - name: Publish demo screenshot to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cp build/demo-launch*.png "$RUNNER_TEMP/demo/" 2>/dev/null || true
          scripts/ci_publish_images.sh "$RUNNER_TEMP/demo" demo-xcode27
      - name: Upload demo screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-xcode27-launch
          path: build/demo-launch*.png
          if-no-files-found: warn

  demo-ios26:
    # The older speech recognizer does not start in the iOS 26.4 and later Simulators (27 too),
    # so DEMO.md tells Emily to add the iOS 26.2 Simulator, and demo.sh then picks it by itself.
    # This proves that path with Xcode 27.
    name: scripts/demo.sh and Listen (Xcode 27, iOS 26.2 Simulator added)
    runs-on: xcode-27
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: scripts/ci_select_xcode.sh 27
      - name: Add the iOS 26.2 Simulator, as DEMO.md step 5 says
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 26.2
          xcrun simctl list runtimes
      - name: Run the demo script (it should pick iOS 26.2 by itself)
        timeout-minutes: 50
        run: |
          mkdir -p build
          # This step hung for 40 minutes or more twice on Oct 23 (it takes 6 to 11), and no log
          # survived. Past 20 minutes, print where demo.sh stopped and what was running, reset
          # the Simulator service, and run it once more.
          status=1
          for attempt in 1 2; do
            /bin/bash scripts/demo.sh > build/demo-ios26.txt 2>&1 &
            pid=$!
            waited=0
            while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt 1200 ]; do sleep 10; waited=$((waited + 10)); done
            if kill -0 "$pid" 2>/dev/null; then
              echo "attempt $attempt: demo.sh still running after 20 minutes. Last lines, then processes:"
              tail -n 20 build/demo-ios26.txt
              ps -axo pid,etime,command | grep -E "simctl|xcodebuild|xcodegen|launchd_sim|CoreSimulator" | grep -v grep || true
              pkill -P "$pid" || true
              kill "$pid" 2>/dev/null || true
              xcrun simctl shutdown all || true
              killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
              continue
            fi
            wait "$pid" && status=0 || status=$?
            cat build/demo-ios26.txt
            break
          done
          [ "$status" = 0 ]
          grep -q "Using the iOS 26.2 Simulator" build/demo-ios26.txt
      - name: Listen on the iOS 26.2 Simulator (Selvo's own log lines, never what was heard)
        if: always()
        run: |
          OUT="$RUNNER_TEMP/ios26"
          mkdir -p "$OUT"
          cp build/demo-launch*.png "$OUT/" 2>/dev/null || true
          UDID=$(python3 scripts/find_simulator.py 'iPhone 16' 26.2)
          xcrun simctl list devices | grep "$UDID" > "$OUT/listen-ios26.txt" || true
          set +e
          # demo.sh leaves Selvo running; close it so the test runner starts on a quiet Simulator.
          xcrun simctl terminate "$UDID" com.emilykenney.selvo 2>/dev/null
          # Once more only if the test runner died before any test ran (Oct 21 twice, Oct 22 once:
          # "while preparing to run tests" or "failed to initialize for UI testing"), or when the
          # Simulator's accessibility server went away mid test (Oct 22: kAXErrorServerNotFound),
          # after a fresh boot. Also when the Simulator could not hand XCTest a screenshot
          # (Oct 23 and Oct 26: "Timed out while requesting screenshot").
          for attempt in 1 2; do
            xcodebuild test -project Selvo.xcodeproj -scheme Selvo -destination "id=$UDID" \
              -derivedDataPath build/DerivedData-ios26 CODE_SIGNING_ALLOWED=NO \
              -only-testing:SelvoUITests/DemoWalkUITests/testListenShowsListeningAndStops \
              > build/listen-ios26.log 2>&1
            status=$?
            [ "$status" = 0 ] && break
            grep -qE "while preparing to run tests|failed to initialize for UI testing|kAXErrorServerNotFound|Timed out while requesting screenshot" build/listen-ios26.log || break
            echo "attempt $attempt: the test runner or the Simulator's accessibility server failed" >> "$OUT/listen-ios26.txt"
            [ "$attempt" = 1 ] || break
            xcrun simctl shutdown "$UDID" 2>/dev/null
            xcrun simctl boot "$UDID" 2>/dev/null
            xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1
          done
          echo "test exit $status" >> "$OUT/listen-ios26.txt"
          grep -E "error|failed|Executed|\*\* " build/listen-ios26.log | tail -40 >> "$OUT/listen-ios26.txt"
          xcrun simctl boot "$UDID" 2>/dev/null
          xcrun simctl bootstatus "$UDID" >/dev/null 2>&1
          # Oct 26: one query came back with no Selvo lines at all, so ask up to three times.
          for try in 1 2 3; do
            xcrun simctl spawn "$UDID" log show --last 2h --style compact \
              --predicate 'subsystem == "com.emilykenney.selvo"' > build/selvo-log.txt 2>&1
            grep -q "com.emilykenney.selvo:listen" build/selvo-log.txt && break
            echo "log query $try found no listen lines" >> "$OUT/listen-ios26.txt"
            # Only log show's own messages, never Selvo's lines.
            grep -v "com.emilykenney.selvo" build/selvo-log.txt | head -5 >> "$OUT/listen-ios26.txt"
            sleep 15
          done
          grep "com.emilykenney.selvo:listen" build/selvo-log.txt >> "$OUT/listen-ios26.txt"
          cat "$OUT/listen-ios26.txt"
          # Both checks must hold; set +e above means each one has to fail the step by itself.
          grep -q "test exit 0" "$OUT/listen-ios26.txt" || exit 1
          grep -q "on device: true" "$OUT/listen-ios26.txt" && ! grep -q "Listening is not available" "$OUT/listen-ios26.txt"
      - name: Publish to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: scripts/ci_publish_images.sh "$RUNNER_TEMP/ios26" demo-xcode27-ios26

  tests:
    name: Build and test (Xcode 27, iOS 27 Simulator)
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: scripts/ci_select_xcode.sh 27
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Find simulator
        run: echo "UDID=$(python3 scripts/find_simulator.py 'iPhone 16')" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$TEST_RUNNER_SCREENSHOT_DIR" build
          # A test sentence in the Mac's voice for SpeechFileProbeTests.
          say -o "$PWD/build/speech-probe.aiff" "I would like a coffee please" || true
          export TEST_RUNNER_SPEECH_PROBE_FILE="$PWD/build/speech-probe.aiff"
          set +e
          xcodebuild test \
            -project Selvo.xcodeproj \
            -scheme Selvo \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1
          status=$?
          # The UI test runner on this runner sometimes dies before any UI test runs (Oct 21 and
          # Oct 22). Only then, and only when no test failed, run the UI tests once more after a
          # fresh boot.
          if [ "$status" -ne 0 ] \
            && grep -qE "while preparing to run tests|failed to initialize for UI testing" build/xcodebuild.log \
            && ! grep -qE "with [1-9][0-9]* failures" build/xcodebuild.log; then
            echo "The UI test runner failed before any UI test ran; running the UI tests once more."
            xcrun simctl shutdown "$UDID" 2>/dev/null
            xcrun simctl boot "$UDID" 2>/dev/null
            xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1
            xcodebuild test-without-building \
              -project Selvo.xcodeproj \
              -scheme Selvo \
              -destination "id=$UDID" \
              -derivedDataPath build/DerivedData \
              -only-testing:SelvoUITests \
              CODE_SIGNING_ALLOWED=NO \
              >> build/xcodebuild.log 2>&1
            status=$?
          fi
          # Only launch failures (the Simulator could not stop or start Selvo): rerun those once.
          if [ "$status" -ne 0 ]; then
            scripts/ci_retry_launch_failures.sh build/xcodebuild.log "$UDID"
            [ $? -eq 0 ] && status=0
          fi
          grep -E "error|failed|Test Suite|Executed|AUDIT|\*\* " build/xcodebuild.log | tail -200
          grep -E "SPEECHPROBE|error|failed|Test Suite|Executed|XCTAssert|\*\* " build/xcodebuild.log | tail -300 > "$TEST_RUNNER_SCREENSHOT_DIR/build-summary.txt" || true
          if [ "$status" -ne 0 ]; then echo "---- last 120 lines ----"; tail -120 build/xcodebuild.log; fi
          exit $status
      - name: Save why Listen could or could not run (Selvo's own log lines, never what was heard)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" >/dev/null 2>&1 || true
          xcrun simctl spawn "$UDID" log show --last 2h --style compact \
            --predicate 'subsystem == "com.emilykenney.selvo"' > "$RUNNER_TEMP/screenshots/selvo-log.txt" 2>&1 || true
          tail -40 "$RUNNER_TEMP/screenshots/selvo-log.txt"
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: scripts/ci_publish_images.sh "$RUNNER_TEMP/screenshots" screenshots-xcode27
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-xcode27
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

