name: Selvo
options:
  bundleIdPrefix: com.emilykenney
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SelvoCore:
    path: SelvoCore

targets:
  Selvo:
    type: application
    platform: iOS
    sources:
      - path: Selvo
    dependencies:
      - package: SelvoCore
    info:
      path: Selvo/Info.plist
      properties:
        CFBundleDisplayName: Selvo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Lexend-Regular.ttf
          - Lexend-SemiBold.ttf
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
        NSMicrophoneUsageDescription: Selvo uses the microphone in Listen to show what people say to you as text.
        NSSpeechRecognitionUsageDescription: Selvo turns what people say to you into text in Listen. When your phone can do this by itself, nothing is sent to Apple.
        NSPhotoLibraryUsageDescription: Selvo lets you choose your own photos for your tiles.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emilykenney.selvo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

  SelvoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SelvoTests
    dependencies:
      - target: Selvo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.emilykenney.selvo.tests

schemes:
  Selvo:
    build:
      targets:
        Selvo: all
        SelvoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SelvoTests
